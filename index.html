<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>Pelacak Blob</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Tata letak: panggung video gelap di kiri, panel instrumen sempit di kanan; di ponsel panel turun ke bawah. */
:root{
  --bg:#eef0f6; --panel:#f8f9fc; --field:#ffffff; --line:#d3d7e3; --fg:#161a26; --muted:#5d6478;
  --accent:#2747e6; --accent-fg:#ffffff; --stage:#090b12; --stage-fg:#c9d0e4; --warn:#b3261e;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f121b; --panel:#161a26; --field:#0f121b; --line:#2b3145; --fg:#e7eaf3; --muted:#959db4;
  --accent:#8ba0ff; --accent-fg:#0b0e18; --stage:#05060a; --stage-fg:#c9d0e4; --warn:#ff8a80; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f121b; --panel:#161a26; --field:#0f121b; --line:#2b3145; --fg:#e7eaf3; --muted:#959db4;
  --accent:#8ba0ff; --accent-fg:#0b0e18; --stage:#05060a; --stage-fg:#c9d0e4; --warn:#ff8a80; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 330px}
.left{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage);color:var(--stage-fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-block:14px;gap:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;color:#fff}
.stat{font-family:var(--mono);font-size:12px;color:var(--stage-fg);font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.stage canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;outline:1px solid #262b3d}
.stage.over::after{content:"Lepas untuk memuat";position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(39,71,230,.35);color:#fff;font-family:var(--display);font-size:20px;border:2px dashed #fff}
.fsui{display:none}
body.fs{overflow:hidden}
body.fs .left{position:fixed;inset:0;z-index:50;background:#000;padding:0;gap:0}
body.fs .bar,body.fs .transport{display:none}
body.fs .stage{flex:1;width:100%;height:100%}
body.fs .stage canvas{width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;outline:0}
body.fs.cover .stage canvas{object-fit:cover}
body.fs .fsui{display:flex;flex-direction:column;align-items:center;gap:10px;position:absolute;left:0;right:0;bottom:0;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.55));transition:opacity .25s}
body.fs.hideui .fsui{opacity:0;pointer-events:none}
.fsbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.fsbar button{background:rgba(22,26,38,.72);color:#fff;border-color:rgba(255,255,255,.25);min-height:44px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.fsbar .fsrec{width:60px;height:60px;border-radius:50%;padding:0;justify-content:center;border:3px solid #fff;background:rgba(0,0,0,.3)}
.fsrec span{display:block;width:44px;height:44px;border-radius:50%;background:#ff3b30;transition:all .2s}
.fsrec.on span{width:24px;height:24px;border-radius:5px}
.fsmsg{margin:0;max-width:34em;text-align:center;font-size:13px;color:#fff;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:4px}
@media (prefers-reduced-motion:reduce){.fsui,.fsrec span{transition:none}}
.transport{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.transport .sp{flex:1}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;
  padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;display:flex;flex-direction:column;gap:18px}
section{display:flex;flex-direction:column;gap:9px}
h2{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin:0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr) 44px;gap:8px;align-items:center}
.row.two{grid-template-columns:104px minmax(0,1fr)}
.row label{font-size:13px}
.row output{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
select,input[type=color]{width:100%;font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:5px 6px;height:30px}
input[type=color]{padding:2px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}
button,.filebtn{font:inherit;font-weight:500;border-radius:4px;border:1px solid var(--line);background:var(--field);color:var(--fg);
  padding:6px 12px;cursor:pointer;min-height:32px;display:inline-flex;align-items:center;gap:6px;position:relative}
.left button,.left .filebtn{background:#161a26;color:#e7eaf3;border-color:#2b3145}
button:hover,.filebtn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.rec{background:var(--warn);border-color:var(--warn);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:12px;color:var(--muted);margin:0}
@media (pointer:coarse){
  button,.filebtn{min-height:44px;padding:8px 14px}
  select,input[type=color]{height:40px;font-size:16px}
  .row{grid-template-columns:96px minmax(0,1fr) 48px}.row.two{grid-template-columns:96px minmax(0,1fr)}
  input[type=range]{height:32px}
}
.note.err{color:var(--warn)}
@media (max-width:820px){
  html,body{height:auto}
  .app{display:block;height:auto}
  .left{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stage canvas{max-height:62vh}
  .transport .sp{display:none}
  #hint{flex-basis:100%}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px))}
}
</style>

<div class="app">
  <div class="left">
    <div class="bar">
      <h1>Pelacak Blob</h1>
      <div class="stat" id="stat">Memuat…</div>
    </div>
    <div class="stage" id="stage"><canvas id="out" width="960" height="540" aria-label="Pratinjau efek pelacakan blob"></canvas>
      <div class="fsui" id="fsui">
        <p class="fsmsg" id="fsMsg" hidden></p>
        <div class="fsbar">
          <button id="fsExit" type="button">Keluar</button>
          <button id="fsFit" type="button">Isi layar</button>
          <button id="fsFlip" type="button" hidden>Ganti kamera</button>
          <button id="fsSave" type="button" hidden>Simpan video</button>
          <button id="fsRec" type="button" class="fsrec" aria-label="Rekam video"><span></span></button>
        </div>
      </div>
    </div>
    <div class="transport">
      <label class="filebtn">Buka video atau gambar
        <input type="file" id="file" accept="video/*,image/png,image/jpeg,image/webp,image/gif">
      </label>
      <button id="camBtn" type="button">Kamera</button>
      <button id="flipBtn" type="button" hidden>Ganti kamera</button>
      <button id="demoBtn" type="button">Pakai contoh</button>
      <button id="playBtn" type="button">Jeda</button>
      <button id="fsBtn" type="button">Layar penuh</button>
      <span class="sp"></span>
      <span class="stat" id="hint">Bisa juga seret file ke pratinjau</span>
    </div>
  </div>

  <aside class="panel">
    <section>
      <h2>Deteksi</h2>
      <div class="row two"><label for="mode">Lacak area</label>
        <select id="mode"><option value="terang">Terang</option><option value="gelap">Gelap</option><option value="gerak">Bergerak</option></select></div>
      <div class="row"><label for="thr">Ambang</label><input type="range" id="thr" min="5" max="95" value="55"><output id="thrO"></output></div>
      <div class="row"><label for="minA">Ukuran min.</label><input type="range" id="minA" min="1" max="100" value="6"><output id="minAO"></output></div>
      <div class="row"><label for="maxN">Jumlah maks.</label><input type="range" id="maxN" min="1" max="24" value="10"><output id="maxNO"></output></div>
      <div class="row"><label for="detail">Detail</label><input type="range" id="detail" min="32" max="192" step="8" value="96"><output id="detailO"></output></div>
      <div class="row"><label for="smooth">Kehalusan</label><input type="range" id="smooth" min="0" max="95" value="60"><output id="smoothO"></output></div>
      <div class="row"><label for="pad">Jarak tepi</label><input type="range" id="pad" min="0" max="40" value="8"><output id="padO"></output></div>
    </section>

    <section>
      <h2>Penanda</h2>
      <div class="row two"><label for="shape">Bentuk</label>
        <select id="shape"><option value="kotak">Kotak</option><option value="sudut">Siku sudut</option><option value="lingkaran">Lingkaran</option><option value="elips">Elips</option><option value="kustom">Bentuk sendiri</option><option value="none">Tanpa bingkai</option></select></div>
      <div class="row two"><label for="shapeFile">Bentuk sendiri</label>
        <label class="filebtn">Unggah bentuk<input type="file" id="shapeFile" accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp"></label></div>
      <p class="note" id="shapeMsg"></p>
      <div class="row two"><label for="link">Garis hubung</label>
        <select id="link"><option value="terdekat">Ke tetangga terdekat</option><option value="rantai">Berantai</option><option value="semua">Semua ke semua</option><option value="none">Tanpa garis</option></select></div>
      <div class="row two"><label for="label">Label</label>
        <select id="label"><option value="lengkap">ID + koordinat</option><option value="id">ID saja</option><option value="koordinat">Koordinat</option><option value="ukuran">Ukuran piksel</option><option value="hex">Kode hex acak</option><option value="none">Tanpa label</option></select></div>
      <div class="row"><label for="lw">Tebal garis</label><input type="range" id="lw" min="5" max="60" value="14"><output id="lwO"></output></div>
      <div class="row"><label for="fs">Ukuran teks</label><input type="range" id="fs" min="8" max="28" value="13"><output id="fsO"></output></div>
      <div class="row two"><label for="col">Warna</label><input type="color" id="col" value="#ffffff"></div>
      <label class="check"><input type="checkbox" id="cross" checked> Tanda silang di titik pusat</label>
    </section>

    <section>
      <h2>Shader</h2>
      <div class="row two"><label for="bg">Latar</label>
        <select id="bg"><option value="0">Asli</option><option value="1" selected>Hitam putih</option><option value="4">Diredupkan</option><option value="2">Negatif</option><option value="3">Dua nada</option></select></div>
      <div class="row two"><label for="inn">Isi bingkai</label>
        <select id="inn"><option value="0">Sama dengan latar</option><option value="5" selected>Warna asli</option><option value="1">Negatif</option><option value="2">Diperbesar 2×</option><option value="3">Piksel</option><option value="4">Termal</option></select></div>
    </section>

    <section>
      <h2>Simpan</h2>
      <div class="btns">
        <button class="primary" id="recBtn" type="button">Rekam video</button>
        <button id="pngBtn" type="button">Simpan PNG</button>
        <button id="saveBtn" type="button" hidden>Simpan ulang video</button>
      </div>
      <p class="note" id="saveMsg">Video direkam satu putaran penuh dari awal. Contoh dan gambar diam direkam 8 detik; kamera direkam sampai Anda menekan Berhenti. Tanpa suara.</p>
    </section>
  </aside>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var out=$('out'), ctx=out.getContext('2d');
var glc=document.createElement('canvas'), gl=glc.getContext('webgl',{premultipliedAlpha:false});
var an=document.createElement('canvas'), actx=an.getContext('2d',{willReadFrequently:true});
var demo=document.createElement('canvas'); demo.width=960; demo.height=540; var dctx=demo.getContext('2d');
var MAXB=24, W=960, H=540;
var src=demo, kind='demo', srcName='Contoh bawaan', video=null, paused=false;
var tracks=[], nextId=1, prevL=null, acc=null;
var S={};

/* ---------- kontrol ---------- */
var fmt={thr:function(v){return v+'%'},minA:function(v){return (v/20).toFixed(2)+'%'},maxN:String,detail:function(v){return v+' px'},
  smooth:function(v){return v+'%'},pad:function(v){return v+' px'},lw:function(v){return (v/10).toFixed(1)},fs:function(v){return v+' px'}};
var ids=['mode','thr','minA','maxN','detail','smooth','pad','shape','link','label','lw','fs','col','cross','bg','inn'];
function readAll(){
  ids.forEach(function(id){var e=$(id); S[id]=e.type==='checkbox'?e.checked:(e.type==='range'?+e.value:e.value);
    if(fmt[id]) $(id+'O').textContent=fmt[id](S[id]);});
  try{localStorage.setItem('pelacak-blob',JSON.stringify(S))}catch(e){}
}
try{var sv=JSON.parse(localStorage.getItem('pelacak-blob')||'null');
  if(sv) ids.forEach(function(id){var e=$(id); if(sv[id]===undefined)return; if(e.type==='checkbox')e.checked=!!sv[id]; else e.value=sv[id];});}catch(e){}
ids.forEach(function(id){$(id).addEventListener('input',readAll)});
readAll();

/* ---------- shader ---------- */
var VS='attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}';
var FS=[
'precision mediump float;varying vec2 v;uniform sampler2D T;uniform vec4 B[24];uniform int N;uniform int uBg;uniform int uIn;uniform int uShape;uniform vec2 R;uniform sampler2D K;uniform vec3 uCol;uniform float uLw;',
'float M(vec2 m){if(m.x<0.||m.x>1.||m.y<0.||m.y>1.)return 0.;return texture2D(K,m).r;}',
'float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}',
'vec3 heat(float t){return clamp(vec3(1.5*t-.25,1.6-abs(3.2*t-1.7),1.2-3.*t)+vec3(smoothstep(.8,1.,t)*.6),0.,1.)*smoothstep(0.,.12,t);}',
'vec3 back(vec3 c){float l=lum(c);',
' if(uBg==1)return vec3(l); if(uBg==2)return 1.-c; if(uBg==3)return vec3(step(.5,l)); if(uBg==4)return vec3(l)*.35; return c;}',
'void main(){vec2 u=v;float hit=0.;vec4 q=vec4(0.);float nr=0.;vec4 nb=vec4(0.);vec2 e=vec2(uLw+1.)/R;',
' for(int i=0;i<24;i++){if(i>=N)break;vec4 b=B[i];bool h=false;',
'  if(uShape==2){if(u.x>b.x-e.x&&u.x<b.z+e.x&&u.y>b.y-e.y&&u.y<b.w+e.y){nr=1.;nb=b;h=M((u-b.xy)/max(b.zw-b.xy,vec2(1e-4)))>.5;}}else',
'  if(uShape==1){vec2 c=(b.xy+b.zw)*.5;vec2 r=max((b.zw-b.xy)*.5,vec2(1e-4));vec2 d=(u-c)/r;h=dot(d,d)<1.;}',
'  else h=u.x>b.x&&u.x<b.z&&u.y>b.y&&u.y<b.w;',
'  if(h){hit=1.;q=b;}}',
' if(uShape==2&&nr>.5){vec4 k=hit>.5?q:nb;vec2 s=max(k.zw-k.xy,vec2(1e-4));vec2 m=(u-k.xy)/s;vec2 d=vec2(uLw*.5+.5)/R/s;float a=M(m);float lo=a;float hi=a;',
'  for(int j=0;j<8;j++){float g=float(j)*.7854;float x=M(m+d*vec2(cos(g),sin(g)));lo=min(lo,x);hi=max(hi,x);}',
'  if(lo<.5&&hi>.5){gl_FragColor=vec4(uCol,1.);return;}}',
' if(hit<.5||uIn==0){gl_FragColor=vec4(back(texture2D(T,u).rgb),1.);return;}',
' vec2 c=(q.xy+q.zw)*.5;',
' if(uIn==2)u=c+(u-c)*.5;',
' if(uIn==3){vec2 g=R/max(R.x/90.,4.);u=(floor(u*g)+.5)/g;}',
' vec3 col=texture2D(T,u).rgb;',
' if(uIn==1)col=1.-col; else if(uIn==4)col=heat(lum(col)); else if(uIn==2||uIn==3)col=back(col);',
' gl_FragColor=vec4(col,1.);}'].join('\n');
var U={}, glOK=false;
(function initGL(){
  if(!gl)return;
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(o));return null}return o}
  var a=sh(gl.VERTEX_SHADER,VS), b=sh(gl.FRAGMENT_SHADER,FS); if(!a||!b)return;
  var pr=gl.createProgram();gl.attachShader(pr,a);gl.attachShader(pr,b);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(pr));return}
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  [gl.TEXTURE1,gl.TEXTURE0].forEach(function(unit){
    gl.activeTexture(unit); gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
  });
  ['B','N','uBg','uIn','uShape','R','T','K','uCol','uLw'].forEach(function(n){U[n]=gl.getUniformLocation(pr,n)});
  gl.uniform1i(U.T,0); gl.uniform1i(U.K,1);
  glOK=true;
})();
var boxBuf=new Float32Array(MAXB*4);

/* ---------- bentuk sendiri ---------- */
var maskC=document.createElement('canvas'); maskC.width=maskC.height=256;
var maskOK=false, maskAspect=1, MASK_KEY='pelacak-blob-bentuk';
var SHAPE_NOTE='PNG transparan atau SVG paling rapi. Pada gambar tanpa transparansi, bentuk diambil dari bagian yang warnanya berbeda dari latar.';
function shapeMsg(s,err){ var m=$('shapeMsg'); m.textContent=s||SHAPE_NOTE; m.className='note'+(err?' err':''); }
function eff(){ return S.shape==='kustom'&&!(maskOK&&glOK)?'kotak':S.shape }
function uploadMask(){ if(!glOK)return; gl.activeTexture(gl.TEXTURE1); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,maskC); gl.activeTexture(gl.TEXTURE0); }
function buildMask(im){
  var iw=im.naturalWidth||256, ih=im.naturalHeight||256, k=256/Math.max(iw,ih), w=Math.max(1,Math.round(iw*k)), h=Math.max(1,Math.round(ih*k));
  var c=document.createElement('canvas'); c.width=w; c.height=h; var x=c.getContext('2d'); x.drawImage(im,0,0,w,h);
  var id=x.getImageData(0,0,w,h), d=id.data, n=w*h, i, hasA=false;
  for(i=0;i<n;i++) if(d[i*4+3]<250){hasA=true;break}
  var cs=[0,w-1,(h-1)*w,(h-1)*w+w-1], br=0,bg=0,bb=0;
  cs.forEach(function(p){br+=d[p*4]/4;bg+=d[p*4+1]/4;bb+=d[p*4+2]/4});
  var x0=w,x1=-1,y0=h,y1=-1;
  for(i=0;i<n;i++){

var stack=new Int32Array(0), lab=new Uint8Array(0);
function detect(){
  var aw=S.detail, ah=Math.max(8,Math.round(aw*H/W)), n=aw*ah;
  if(an.width!==aw||an.height!==ah){an.width=aw;an.height=ah;prevL=null}
  actx.drawImage(src,0,0,aw,ah);
  var d;
  try{ d=actx.getImageData(0,0,aw,ah).data }catch(e){ return [] }
  if(lab.length!==n){lab=new Uint8Array(n);stack=new Int32Array(n)}

  for(i=0;i<n;i++) L[i]=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;
  if(mode==='gerak'){
    if(!prevL||prevL.length!==n){prevL=L;acc=new Float32Array(n)}
    var mt=4+S.thr*.35;
    for(i=0;i<n;i++){var df=Math.abs(L[i]-prevL[i]); acc[i]=Math.max(acc[i]*.82,df); lab[i]=acc[i]>mt?1:0}
    prevL=L;
  } else if(mode==='gelap'){ for(i=0;i<n;i++)lab[i]=L[i]<255-t?1:0 }
  else { for(i=0;i<n;i++)lab[i]=L[i]>t?1:0 }
  var res=[], minC=Math.max(2,n*S.minA/2000);
  for(i=0;i<n;i++){
    if(lab[i]!==1)continue;
    var sp=0, x0=aw, x1=0, y0=ah, y1=0, c=0; stack[sp++]=i; lab[i]=2;
    while(sp){
      var p=stack[--sp], px=p%aw, py=(p/aw)|0; c++;
      if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py;
      for(var dy=-1;dy<=1;dy++){var yy=py+dy; if(yy<0||yy>=ah)continue;
        for(var dx=-1;dx<=1;dx++){var xx=px+dx; if(xx<0||xx>=aw)continue; var q=yy*aw+xx; if(lab[q]===1){lab[q]=2;stack[sp++]=q}}}
    }
    if(c>=minC) res.push({x0:x0/aw,y0:y0/ah,x1:(x1+1)/aw,y1:(y1+1)/ah,c:c});
  }
  res.sort(function(a,b){return b.c-a.c});

function track(dets){
  var used={}, k=1-S.smooth/100;
  dets.forEach(function(d){
    var cx=(d.x0+d.x1)/2, cy=(d.y0+d.y1)/2, best=null, bd=.18;
    tracks.forEach(function(tr){ if(used[tr.id])return;
      var dd=Math.hypot((tr.tx0+tr.tx1)/2-cx,(tr.ty0+tr.ty1)/2-cy); if(dd<bd){bd=dd;best=tr} });
    if(!best){ best={id:nextId++,x0:d.x0,y0:d.y0,x1:d.x1,y1:d.y1,age:0,miss:0}; if(nextId>99)nextId=1; tracks.push(best); }
    used[best.id]=1; best.tx0=d.x0; best.ty0=d.y0; best.tx1=d.x1; best.ty1=d.y1; best.miss=0; best.age++;
  });
  tracks=tracks.filter(function(tr){
    if(!used[tr.id])tr.miss++;
    tr.x0+=(tr.tx0-tr.x0)*k; tr.y0+=(tr.ty0-tr.y0)*k; tr.x1+=(tr.tx1-tr.x1)*k; tr.y1+=(tr.ty1-tr.y1)*k;
    return tr.miss<=8;

    b.cx=(b.x0+b.x1)/2; b.cy=(b.y0+b.y1)/2;
    var sh=eff();

      var side=Math.max((b.x1-b.x0)*W,(b.y1-b.y0)*H), a=sh==='kustom'?maskAspect:1, mw=a>=1?side:side*a, mh=a>=1?side/a:side;

    }

$('fsSave').addEventListener('click',function(){ $('saveBtn').click(); showUI(); });
$('fsRec').addEventListener('click',function(){ $('recBtn').click(); setTimeout(syncFs,50); showUI(); });
$('stage').addEventListener('click',function(e){ if(!fsOn()||e.target.closest('.fsui'))return; if(B.classList.contains('hideui'))showUI(); else { B.classList.add('hideui'); clearTimeout(hideT); } });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&fsOn())exitFs(); });
new MutationObserver(function(){ syncFs(); }).observe(document.querySelector('.transport'),{subtree:true,attributes:true,attributeFilter:['hidden']});
new MutationObserver(function(){ syncFs(); }).observe(document.querySelector('.panel .btns'),{subtree:true,attributes:true,childList:true,characterData:true,attributeFilter:['hidden','class']});
var fsMsgT=0;
new MutationObserver(function(){ if(!fsOn())return; var m=$('fsMsg'); m.textContent=$('saveMsg').textContent; m.hidden=false; showUI();
  clearTimeout(fsMsgT); fsMsgT=setTimeout(function(){m.hidden=true},5000); syncFs(); }).observe($('saveMsg'),{childList:true,characterData:true,subtree:true});
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&fsOn()&&navigator.wakeLock){ navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){}); } });

/* ---------- simpan ---------- */
var downloads=null, mr=null, chunks=[], lastBlob=null, lastExt='webm', recT0=0, recTimer=0;
function msg(s,err){ var m=$('saveMsg'); m.textContent=s||'Video direkam satu putaran penuh dari awal. Contoh dan gambar diam direkam 8 detik; kamera direkam sampai Anda menekan Berhenti. Tanpa suara.'; m.className='note'+(err?' err':''); }
function stamp(){ var d=new Date(); return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'-'+pad2(d.getHours())+pad2(d.getMinutes())+pad2(d.getSeconds()) }
function canShareFile(blob,ext){
  try{ var f=new File([blob],'pelacak-blob.'+ext,{type:blob.type}); return navigator.canShare&&navigator.share&&navigator.canShare({files:[f]})?f:null; }catch(e){ return null; } }
function save(blob,ext){
  if(!downloads&&!window.claude&&isPhone){ var f=canShareFile(blob,ext);
    if(f) return navigator.share({files:[f]}).then(function(){ msg('Terkirim. Pilih "Simpan Video" atau "Simpan Gambar" untuk menaruhnya di Foto.'); return true; })
      .catch(function(e){ if(e&&e.name==='AbortError'){ msg('Penyimpanan dibatalkan.'); } else { $('saveBtn').hidden=false; msg('Ketuk "Simpan ulang video" untuk membuka lembar Bagikan.'); } return false; }); }
  if(!downloads&&!window.claude){ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pelacak-blob-'+stamp()+'.'+ext;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href)},60000); msg('Tersimpan ke folder unduhan.'); return Promise.resolve(true); }
  if(!downloads){ msg('Menyimpan file tidak tersedia di tampilan ini.',true); return Promise.resolve(false); }
  return downloads.save({filename:'pelacak-blob-'+stamp()+'.'+ext,data:blob}).then(function(){ msg('Tersimpan.'); return true; })
    .catch(function(e){ var c=e&&e.code;
      msg(c==='declined'?'Penyimpanan dibatalkan.':c==='rate_limited'?'Masih ada dialog simpan yang terbuka. Coba lagi sebentar.':'File tidak bisa disimpan di sini ('+(c||'tidak diketahui')+').',c!=='declined');
      return false; });
}
function pickMime(){
  if(!window.MediaRecorder)return null;
  var c=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for(var i=0;i<c.length;i++) if(MediaRecorder.isTypeSupported(c[i])) return c[i];
  return null;
}
function stopRec(){ if(mr&&mr.state!=='inactive')mr.stop(); }
$('recBtn').addEventListener('click',function(){
  if(mr){ stopRec(); return; }
  var mime=pickMime();
  if(!mime||!out.captureStream){ msg('Browser ini tidak bisa merekam video dari kanvas. Coba Chrome atau Edge.',true); return; }
  lastExt=mime.indexOf('mp4')>=0?'mp4':'webm'; chunks=[];
  try{ mr=new MediaRecorder(out.captureStream(30),{mimeType:mime,videoBitsPerSecond:12e6}); }
  catch(e){ mr=null; msg('Perekaman gagal dimulai: '+e.message,true); return; }
  mr.ondataavailable=function(e){ if(e.data&&e.data.size)chunks.push(e.data) };
  mr.onstop=function(){
    clearInterval(recTimer); var b=$('recBtn'); b.textContent='Rekam video'; b.classList.remove('rec'); b.classList.add('primary');
    if(video){ video.loop=true; video.removeEventListener('ended',stopRec); if(!paused)video.play().catch(function(){}); }
    mr=null; if(!chunks.length){ msg('Rekaman kosong. Coba lagi.',true); return; }
    lastBlob=new Blob(chunks,{type:mime}); $('saveBtn').hidden=false;
    if(!downloads&&!window.claude&&isPhone){ $('saveBtn').textContent='Simpan video'; msg('Rekaman selesai ('+(lastBlob.size/1048576).toFixed(1)+' MB). Ketuk "Simpan video", lalu pilih "Simpan Video".'); return; }
    msg('Rekaman selesai ('+(lastBlob.size/1048576).toFixed(1)+' MB). Menunggu konfirmasi simpan…'); save(lastBlob,lastExt);
  };
  var limit=kind==='camera'?600:8;
  if(video){ video.loop=false; video.currentTime=0; paused=false; syncPlay(); video.addEventListener('ended',stopRec); video.play().catch(function(){}); limit=600; }
  mr.start(500); recT0=performance.now();
  var b=$('recBtn'); b.classList.add('rec'); b.classList.remove('primary');
  recTimer=setInterval(function(){ var s=(performance.now()-recT0)/1000; b.textContent='Berhenti ('+s.toFixed(1)+' dtk)'; if(s>=limit)stopRec(); },100);
  msg('Merekam… biarkan tab ini tetap terbuka.');
});
$('saveBtn').addEventListener('click',function(){ if(lastBlob)save(lastBlob,lastExt) });
$('pngBtn').addEventListener('click',function(){
  if(!downloads&&!window.claude&&isPhone){ try{ var du=out.toDataURL('image/png'), bs=atob(du.split(',')[1]), ar=new Uint8Array(bs.length);
    for(var i=0;i<bs.length;i++)ar[i]=bs.charCodeAt(i); save(new Blob([ar],{type:'image/png'}),'png'); }catch(e){ msg('Gambar tidak bisa dibuat.',true); } return; }
  out.toBlob(function(b){ if(b)save(b,'png'); else msg('Gambar tidak bisa dibuat.',true); },'image/png'); });
(window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null)).then(function(d){
  downloads=d; if(!d&&window.claude){ $('recBtn').hidden=$('pngBtn').hidden=true; msg('Menyimpan file tidak tersedia di tampilan ini. Buka halaman ini di claude.ai untuk merekam.',true); }
}).catch(function(){});
syncPlay();
})();
</script>
</body></html>
